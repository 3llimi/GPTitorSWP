# Builds the React app as a static site and publishes it to GitHub Pages.
# The app runs fully in the browser (see React/src/localApi), so no backend is deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: React
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # package-lock.json is git-ignored, so install from package.json.
      - run: npm install --no-audit --no-fund

      - run: npx jest --config jest.config.ts --coverage=false

      - name: Build
        run: npx vite build
        env:
          # Pages serves a project site at /<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      # Serve the app for unknown paths too, so reloading /<repo>/profile works.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: React/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
